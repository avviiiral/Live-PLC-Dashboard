services:
 db:
  image: postgres:16-alpine
  environment:
   POSTGRES_DB: ${POSTGRES_DB:-live_plc}
   POSTGRES_USER: ${POSTGRES_USER:-live_plc}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  volumes: [postgres_data:/var/lib/postgresql/data]
  healthcheck:
   test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-live_plc}"]
   interval: 5s
   timeout: 5s
   retries: 10
 backend:
  build:
   context: .
   dockerfile: backend/Dockerfile
  env_file: [.env]
  environment:
   DB_ENGINE: postgresql
   POSTGRES_HOST: db
  depends_on:
   db:
    condition: service_healthy
  ports: ["8000:8000"]
 frontend:
  build:
   context: .
   dockerfile: frontend/Dockerfile
  depends_on: [backend]
  ports: ["8080:80"]
volumes:
 postgres_data:
